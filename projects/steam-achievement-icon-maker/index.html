<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <title>Pixel Image Converter</title>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        :root {
            --bg: #0b0e14;
            --panel: #141824;
            --panel-2: #1b2032;
            --border: #2a2f45;
            --text: #e6e9f0;
            --muted: #9aa3c7;
            --accent: #6cf2c2;
            --accent-2: #7aa2ff;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(1200px 600px at 10% -10%, #1a1f35, transparent),
                radial-gradient(800px 400px at 90% 10%, #10261f, transparent),
                var(--bg);
            color: var(--text);
            font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
        }

        .container {
            max-width: 1100px;
            margin: auto;
            padding: 32px;
        }

        header {
            margin-bottom: 24px;
        }

        h1 {
            font-size: 1.8rem;
            margin: 0;
            letter-spacing: 0.4px;
        }

        .subtitle {
            color: var(--muted);
            margin-top: 6px;
            font-size: 0.95rem;
        }

        .card {
            background: linear-gradient(180deg, var(--panel), var(--panel-2));
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 20px;
            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.45),
                inset 0 1px 0 rgba(255, 255, 255, 0.03);
            margin-bottom: 20px;
        }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            align-items: center;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        label {
            font-size: 0.75rem;
            color: var(--muted);
        }

        input[type="number"] {
            background: #0f1322;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px 10px;
            border-radius: 8px;
            width: 100px;
            font-size: 0.9rem;
        }

        input:focus {
            outline: none;
            border-color: var(--accent-2);
        }

        button {
            background: linear-gradient(180deg, #2a3050, #1c213b);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 10px 18px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.15s;
        }

        button:hover {
            transform: translateY(-1px);
            border-color: var(--accent);
        }

        button:disabled {
            opacity: 0.4;
            cursor: default;
            transform: none;
        }

        button.primary {
            background: linear-gradient(180deg, #3a5cff, #2b3fb8);
            border-color: #415eff;
        }

        .dropzone {
            margin-top: 14px;
            border: 2px dashed var(--border);
            border-radius: 14px;
            padding: 34px;
            text-align: center;
            color: var(--muted);
            cursor: pointer;
            transition: 0.2s;
        }

        .dropzone strong {
            color: var(--text);
        }

        .dropzone.dragover {
            border-color: var(--accent);
            background: rgba(108, 242, 194, 0.05);
            color: var(--text);
        }

        .preview {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 14px;
            margin-top: 14px;
        }

        .preview img {
            width: 100%;
            background: #0c0f1c;
            border-radius: 10px;
            padding: 6px;
            border: 1px solid var(--border);
            image-rendering: pixelated;
        }

        .footer {
            margin-top: 30px;
            font-size: 0.8rem;
            color: var(--muted);
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="container">

        <header>
            <h1>Pixel Image Converter</h1>
            <div class="subtitle">
                Nearest-neighbor resize + grayscale export (browser-only)
            </div>
        </header>

        <div class="card">
            <div class="controls">
                <div class="field">
                    <label>Width</label>
                    <input type="number" id="width" value="256" min="1">
                </div>

                <div class="field">
                    <label>Height</label>
                    <input type="number" id="height" value="256" min="1">
                </div>

                <button class="primary" id="convert">Convert</button>
                <button id="download" disabled>Download ZIP</button>
            </div>

            <div class="dropzone" id="dropzone">
                <strong>Drag & drop images</strong><br>
                or click to browse
                <input type="file" id="fileInput" multiple accept="image/*" hidden>
            </div>
        </div>

        <div class="card">
            <div class="preview" id="preview"></div>
        </div>

        <div class="footer">
            No uploads · No tracking · Runs locally
        </div>

    </div>

    <script>
        const dropzone = document.getElementById("dropzone");
        const fileInput = document.getElementById("fileInput");
        const preview = document.getElementById("preview");
        const convertBtn = document.getElementById("convert");
        const downloadBtn = document.getElementById("download");

        let files = [];
        let zip = new JSZip();

        dropzone.addEventListener("click", () => fileInput.click());

        fileInput.addEventListener("change", e => {
            files = [...e.target.files];
            dropzone.querySelector("strong").textContent =
                `${files.length} image(s) selected`;
        });

        dropzone.addEventListener("dragover", e => {
            e.preventDefault();
            dropzone.classList.add("dragover");
        });

        dropzone.addEventListener("dragleave", () => {
            dropzone.classList.remove("dragover");
        });

        dropzone.addEventListener("drop", e => {
            e.preventDefault();
            dropzone.classList.remove("dragover");
            files = [...e.dataTransfer.files].filter(f => f.type.startsWith("image/"));
            dropzone.querySelector("strong").textContent =
                `${files.length} image(s) dropped`;
        });

        convertBtn.addEventListener("click", async () => {
            preview.innerHTML = "";
            zip = new JSZip();

            const width = +document.getElementById("width").value;
            const height = +document.getElementById("height").value;

            for (const file of files) {
                const img = await loadImage(file);

                const canvas = document.createElement("canvas");
                canvas.width = width;
                canvas.height = height;

                const ctx = canvas.getContext("2d");
                ctx.imageSmoothingEnabled = false;
                ctx.drawImage(img, 0, 0, width, height);

                const colorBlob = await canvasToBlob(canvas);
                zip.file(`color/${file.name.replace(/\.[^/.]+$/, "")}.png`, colorBlob);

                addPreview(colorBlob);

                const imgData = ctx.getImageData(0, 0, width, height);
                for (let i = 0; i < imgData.data.length; i += 4) {
                    const g = (imgData.data[i] + imgData.data[i + 1] + imgData.data[i + 2]) / 3;
                    imgData.data[i] = imgData.data[i + 1] = imgData.data[i + 2] = g;
                }
                ctx.putImageData(imgData, 0, 0);

                const grayBlob = await canvasToBlob(canvas);
                zip.file(`grayscale/${file.name.replace(/\.[^/.]+$/, "")}_gray.png`, grayBlob);

                addPreview(grayBlob);
            }

            downloadBtn.disabled = false;
        });

        downloadBtn.addEventListener("click", async () => {
            const blob = await zip.generateAsync({ type: "blob" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob);
            a.download = "images.zip";
            a.click();
        });

        function addPreview(blob) {
            const img = document.createElement("img");
            img.src = URL.createObjectURL(blob);
            preview.appendChild(img);
        }

        function loadImage(file) {
            return new Promise(res => {
                const img = new Image();
                img.onload = () => res(img);
                img.src = URL.createObjectURL(file);
            });
        }

        function canvasToBlob(canvas) {
            return new Promise(res => canvas.toBlob(res, "image/png"));
        }
    </script>

</body>

</html>
